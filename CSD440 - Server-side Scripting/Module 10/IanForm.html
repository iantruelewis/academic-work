<!DOCTYPE html>
<html>
<head>
    <title>Ian's JSON Form</title>
</head>
<body>
    <h2>Please fill out the form</h2>
    <!-- This form asks user to enter at least 8 fields -->
    <!-- When submitted, it sends data to IanJSON.php using POST -->
    <form action="IanJSON.php" method="post">
        First Name: <input type="text" name="first_name"><br><br>
        Last Name: <input type="text" name="last_name"><br><br>
        Email: <input type="email" name="email"><br><br>
        Age: <input type="number" name="age"><br><br>
        City: <input type="text" name="city"><br><br>
        Country: <input type="text" name="country"><br><br>
        Favorite Color: <input type="text" name="favorite_color"><br><br>
        Hobby: <input type="text" name="hobby"><br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
